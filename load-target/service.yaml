apiVersion: v1
kind: Service
metadata:
  name: load-target
  namespace: fluid-autoscaler
  labels:
    app: load-target
spec:
  type: ClusterIP
  selector:
    app: load-target
  ports:
    - name: http
      port: 80          # The port the Service listens on inside the cluster.
      targetPort: 8080  # The port the container actually serves on.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-target-deployment
  namespace: fluid-autoscaler
  labels:
    app: load-target
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-target
  template:
    metadata: 
      labels:
        app: load-target
    spec: 
      containers:
      - name: load-target
        image: load-target:0.0.1-ubuntu
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: load-target-clusterip
  namespace: fluid-autoscaler
  labels:
    app: load-target
spec:
  type: ClusterIP
  selector:
    app: load-target
  ports:
    - name: http
      port: 80          # The port the Service listens on inside the cluster.
      targetPort: 8080  # The port the container actually serves on.
